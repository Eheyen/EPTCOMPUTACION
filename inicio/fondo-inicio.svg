<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700">

    <defs>
        <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#005A9E"></stop>
            <stop offset="55%" stop-color="#0078D4"></stop>
            <stop offset="100%" stop-color="#003F70"></stop>
        </linearGradient>

        <linearGradient id="pantalla" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"></stop>
            <stop offset="100%" stop-color="#DCEEFF"></stop>
        </linearGradient>

        <linearGradient id="amarillo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFB900"></stop>
            <stop offset="100%" stop-color="#FFD65A"></stop>
        </linearGradient>

        <radialGradient id="brillo">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"></stop>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
        </radialGradient>

        <filter id="sombra">
            <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#003B68" flood-opacity="0.35"></feDropShadow>
        </filter>
    </defs>


    <!-- FONDO -->

    <rect width="1600" height="700" fill="url(#fondo)"></rect>

    <circle cx="1250" cy="320" r="430" fill="url(#brillo)"></circle>


    <!-- PATRÓN DE PUNTOS -->

    <g fill="#FFFFFF" opacity="0.10">

        <circle cx="80" cy="90" r="2"></circle>
        <circle cx="130" cy="140" r="2"></circle>
        <circle cx="180" cy="80" r="2"></circle>
        <circle cx="230" cy="130" r="2"></circle>
        <circle cx="280" cy="70" r="2"></circle>

        <circle cx="80" cy="580" r="2"></circle>
        <circle cx="140" cy="630" r="2"></circle>
        <circle cx="200" cy="570" r="2"></circle>
        <circle cx="260" cy="620" r="2"></circle>

        <circle cx="1450" cy="80" r="2"></circle>
        <circle cx="1510" cy="130" r="2"></circle>
        <circle cx="1560" cy="80" r="2"></circle>

    </g>


    <!-- CÍRCULOS DECORATIVOS -->

    <circle cx="1320" cy="350" r="270" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.08"></circle>

    <circle cx="1320" cy="350" r="220" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.08"></circle>

    <circle cx="1320" cy="350" r="170" fill="none" stroke="#FFB900" stroke-width="2" opacity="0.18"></circle>


    <!-- CIRCUITOS -->

    <g fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.28">

        <path d="M900 100 H1030 V170 H1130"></path>
        <path d="M1010 250 H1110 V190 H1210"></path>
        <path d="M1450 120 H1510 V210 H1570"></path>
        <path d="M1460 560 H1530 V480 H1580"></path>

        <path d="M1000 550 H1090 V610 H1200"></path>
        <path d="M1360 110 V170 H1420"></path>
        <path d="M1490 330 H1570"></path>

    </g>


    <!-- NODOS -->

    <g fill="#FFB900">

        <circle cx="900" cy="100" r="7"></circle>
        <circle cx="1030" cy="170" r="7"></circle>
        <circle cx="1130" cy="170" r="7"></circle>

        <circle cx="1010" cy="250" r="7"></circle>
        <circle cx="1110" cy="190" r="7"></circle>
        <circle cx="1210" cy="190" r="7"></circle>

        <circle cx="1450" cy="120" r="7"></circle>
        <circle cx="1510" cy="210" r="7"></circle>
        <circle cx="1570" cy="210" r="7"></circle>

        <circle cx="1000" cy="550" r="7"></circle>
        <circle cx="1090" cy="610" r="7"></circle>
        <circle cx="1200" cy="610" r="7"></circle>

    </g>


    <!-- COMPUTADORA PRINCIPAL -->

    <g filter="url(#sombra)">

        <!-- Monitor -->

        <rect x="1010" y="190" width="470" height="300" rx="22" fill="#FFFFFF" opacity="0.98"></rect>

        <!-- Marco interior -->

        <rect x="1030" y="210" width="430" height="260" rx="12" fill="#003F70"></rect>

        <!-- Pantalla -->

        <rect x="1045" y="225" width="400" height="230" rx="8" fill="url(#pantalla)"></rect>


        <!-- Código en pantalla -->

        <g font-family="monospace" font-size="22" font-weight="bold">

            <text x="1080" y="270" fill="#0078D4">&lt;html&gt;</text>

            <text x="1100" y="310" fill="#005A9E">
                &lt;h1&gt;EPT
            </text>

            <text x="1100" y="350" fill="#107C10">
                Computación
            </text>

            <text x="1100" y="390" fill="#E81123">
                &lt;/h1&gt;
            </text>

            <text x="1080" y="430" fill="#0078D4">
                &lt;/html&gt;
            </text>

        </g>


        <!-- Base del monitor -->

        <path d="M1190 490
                 H1300
                 L1340 535
                 H1150
                 Z" fill="#FFFFFF"></path>

        <rect x="1135" y="535" width="220" height="18" rx="9" fill="#DCEEFF"></rect>

    </g>


    <!-- TECLADO -->

    <g transform="translate(930 555)" filter="url(#sombra)">

        <rect width="430" height="90" rx="18" fill="#FFFFFF" opacity="0.95"></rect>

        <g fill="#0078D4">

            <rect x="20" y="18" width="35" height="18" rx="4"></rect>
            <rect x="65" y="18" width="35" height="18" rx="4"></rect>
            <rect x="110" y="18" width="35" height="18" rx="4"></rect>
            <rect x="155" y="18" width="35" height="18" rx="4"></rect>
            <rect x="200" y="18" width="35" height="18" rx="4"></rect>
            <rect x="245" y="18" width="35" height="18" rx="4"></rect>
            <rect x="290" y="18" width="35" height="18" rx="4"></rect>
            <rect x="335" y="18" width="35" height="18" rx="4"></rect>

            <rect x="20" y="45" width="50" height="18" rx="4"></rect>
            <rect x="80" y="45" width="50" height="18" rx="4"></rect>
            <rect x="140" y="45" width="120" height="18" rx="4"></rect>
            <rect x="270" y="45" width="50" height="18" rx="4"></rect>
            <rect x="330" y="45" width="40" height="18" rx="4"></rect>

        </g>

    </g>


    <!-- CÍRCULO TECNOLÓGICO -->

    <g transform="translate(850 230)">

        <circle cx="0" cy="0" r="70" fill="#FFFFFF" opacity="0.08"></circle>

        <circle cx="0" cy="0" r="52" fill="none" stroke="#FFB900" stroke-width="5" opacity="0.75"></circle>

        <path d="M-25 -5
                 L-5 -25
                 L25 -5
                 L5 15
                 L-25 -5 Z" fill="none" stroke="#FFFFFF" stroke-width="6"></path>

        <circle cx="-25" cy="-5" r="6" fill="#FFFFFF"></circle>
        <circle cx="-5" cy="-25" r="6" fill="#FFFFFF"></circle>
        <circle cx="25" cy="-5" r="6" fill="#FFFFFF"></circle>
        <circle cx="5" cy="15" r="6" fill="#FFFFFF"></circle>

    </g>


    <!-- NUBE DIGITAL -->

    <g transform="translate(1380 100)" opacity="0.35">

        <path d="M0 60
                 C0 35 20 18 45 18
                 C60 18 73 25 82 37
                 C90 27 104 22 118 22
                 C145 22 165 43 165 68
                 C165 71 165 74 164 77
                 H25
                 C11 77 0 70 0 60 Z" fill="#FFFFFF"></path>

        <path d="M70 48 V92" stroke="#0078D4" stroke-width="7"></path>

        <path d="M52 70 L70 92 L88 70" fill="none" stroke="#0078D4" stroke-width="7"></path>

    </g>


    <!-- PEQUEÑOS NODOS FLOTANTES -->

    <g opacity="0.65">

        <circle cx="850" cy="500" r="12" fill="#FFB900"></circle>
        <circle cx="900" cy="520" r="7" fill="#FFFFFF"></circle>
        <circle cx="1510" cy="420" r="10" fill="#FFB900"></circle>
        <circle cx="1550" cy="450" r="6" fill="#FFFFFF"></circle>

    </g>


    <!-- LÍNEAS DE CONEXIÓN -->

    <g stroke="#FFFFFF" stroke-width="2" opacity="0.16" fill="none">

        <path d="M780 180 L850 230"></path>
        <path d="M850 230 L1010 250"></path>
        <path d="M850 500 L930 555"></path>
        <path d="M1480 490 L1510 420"></path>

    </g>


    <!-- DECORACIÓN AMARILLA -->

    <path d="M760 620
             C850 580 900 600 960 650" fill="none" stroke="#FFB900" stroke-width="5" opacity="0.35"></path>

    <circle cx="760" cy="620" r="8" fill="#FFB900"></circle>


    <!-- BRILLOS -->

    <g fill="#FFFFFF">

        <circle cx="790" cy="130" r="3" opacity="0.7"></circle>
        <circle cx="820" cy="155" r="5" opacity="0.4"></circle>
        <circle cx="1550" cy="300" r="4" opacity="0.6"></circle>
        <circle cx="760" cy="450" r="4" opacity="0.4"></circle>

    </g>

</svg>